services:
  traefik:
    image: traefik:v3.1
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.email=info@valutafacile.it"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-certs:/letsencrypt"
    restart: unless-stopped
    networks:
      - app-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${LISTMONK_db__user:-listmonk}
      POSTGRES_PASSWORD: ${LISTMONK_db__password:-listmonk}
      POSTGRES_DB: ${LISTMONK_db__database:-listmonk}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LISTMONK_db__user:-listmonk}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-net

  # Avvio normale: docker compose -f docker-compose.prod.yml --profile run up -d
  listmonk:
    image: listmonk/listmonk:latest
    ports:
      - "9000:9000"
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["run"]
    restart: unless-stopped
    networks:
      - app-net

  # Setup iniziale (una tantum): docker compose -f docker-compose.prod.yml --profile setup up listmonk-setup
  listmonk-setup:
    image: listmonk/listmonk:latest
    env_file:
      - .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["setup"]
    command: ["./listmonk", "--install", "--yes"]
    restart: "no"
    networks:
      - app-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 4000
      OMI_KML_PATH: /app/omi
      OMI_DB_PATH: /app/omi-data/omi_official.sqlite
    volumes:
      - db-data:/app/data
      - uploads-data:/app/uploads
      - ./omi:/app/omi:ro
      - ./data:/app/omi-data:ro
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_USE_MOCKS: "false"
        VITE_GROQ_API_KEY: ${VITE_GROQ_API_KEY}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`valutafacile.it`) || Host(`www.valutafacile.it`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=le"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - app-net

volumes:
  db-data:
  postgres-data:
  uploads-data:
  traefik-certs:
networks:
  app-net:
    driver: bridge
