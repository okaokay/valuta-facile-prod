server {
  listen 80;
  server_name _;

  client_max_body_size 50m;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    # $uri/ è necessario perché le pagine prerenderizzate (vedi
    # scripts/prerender.mjs) vengono scritte come directory con un
    # index.html dentro (es. dist/blog/<slug>/index.html per /blog/<slug>):
    # senza $uri/ nginx proverebbe solo il file letterale $uri (che non
    # esiste, essendo una directory) e cadrebbe sempre sulla SPA vuota.
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
